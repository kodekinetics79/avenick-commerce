name: Fix pilot typecheck

on:
  push:
    branches:
      - pilot-overhaul/2026-08-12
    paths:
      - scripts/fix-pilot-typecheck.mjs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot-overhaul/2026-08-12
          fetch-depth: 0
      - run: node scripts/fix-pilot-typecheck.mjs
      - name: Commit deterministic type repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(types): satisfy Prisma audit and JSON contracts"
          git push origin HEAD:pilot-overhaul/2026-08-12
