name: Apply pilot commerce schema

on:
  push:
    branches:
      - pilot-overhaul/2026-08-12
    paths:
      - scripts/apply-pilot-commerce-schema.mjs
      - .github/workflows/apply-pilot-commerce-schema.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overhaul branch
        uses: actions/checkout@v4
        with:
          ref: pilot-overhaul/2026-08-12
          fetch-depth: 0

      - name: Apply deterministic schema patch
        run: node scripts/apply-pilot-commerce-schema.mjs

      - name: Commit generated schema and migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/prisma/schema.prisma packages/database/prisma/migrations/20260813014500_pilot_commerce_control_plane/migration.sql
          git commit -m "feat(database): add pilot commerce control plane"
          git push origin HEAD:pilot-overhaul/2026-08-12
