name: Diagnose typecheck

on:
  push:
    branches:
      - pilot-overhaul/2026-08-12
    paths:
      - .github/workflows/diagnose-typecheck.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot-overhaul/2026-08-12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate repository pnpm version
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @avenick/database db:generate
      - name: Capture typecheck output
        shell: bash
        run: |
          mkdir -p docs/qa
          set +e
          pnpm typecheck > docs/qa/typecheck-diagnostic.txt 2>&1
          code=$?
          echo "TYPECHECK_EXIT_CODE=$code" >> docs/qa/typecheck-diagnostic.txt
          exit 0
      - name: Commit diagnostic transcript
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/typecheck-diagnostic.txt
          git commit -m "chore(ci): capture typecheck diagnostics"
          git push origin HEAD:pilot-overhaul/2026-08-12
