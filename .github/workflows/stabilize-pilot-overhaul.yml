name: Stabilize pilot overhaul

on:
  push:
    branches:
      - pilot-overhaul/2026-08-12
    paths:
      - scripts/stabilize-pilot-overhaul.mjs

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot-overhaul/2026-08-12
          fetch-depth: 0
      - run: node scripts/stabilize-pilot-overhaul.mjs
      - name: Commit deterministic cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(pilot): consolidate importer and remove bootstrap generators"
          git push origin HEAD:pilot-overhaul/2026-08-12
