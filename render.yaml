# Render Blueprint — deploys the backend runtime for the three Avenick portals.
# In the Render dashboard: New → Blueprint → select this repo.
#
# Notes
# - Neon is the single PostgreSQL system of record.
# - Vercel hosts each portal as a complete Next.js application, including its
#   API routes. It does not proxy authenticated sessions across runtimes.
# - Render hosts the integration worker and can host independent portal
#   runtimes when an operator deliberately selects that topology.
# - Optional integrations (Checkout.com, Anthropic, Resend, Twilio, S3) are
#   added later as env vars in the dashboard; the apps degrade gracefully
#   without them. See DEPLOYMENT.md.
# - Observability: set OTEL_EXPORTER_OTLP_ENDPOINT + OTEL_EXPORTER_OTLP_HEADERS
#   (sync:false, from the Grafana Cloud stack) to turn on traces + metrics.
#   Until then telemetry no-ops and structured logs still stream to stdout.
#   See OBSERVABILITY.md for the setup + on-call runbook.

previews:
  generation: off

services:
  - type: worker
    name: avenick-integration-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm@11.4.0 && pnpm install --frozen-lockfile && pnpm --filter @avenick/database db:generate
    preDeployCommand: bash -lc 'export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && pnpm --filter @avenick/database db:deploy'
    startCommand: pnpm --filter @avenick/database integration:worker
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: INTEGRATION_WORKER_ID
        value: "render-primary"
      # Each ERP adapter is pinned to an operator-owned origin and a dedicated
      # token variable. Admin configuration cannot select arbitrary hosts or
      # dereference unrelated runtime secrets.
      - key: INTEGRATION_D365_BASE_URL
        sync: false
      - key: INTEGRATION_D365_CREDENTIAL_REF
        value: "env:INTEGRATION_D365_TOKEN"
      - key: INTEGRATION_D365_TOKEN
        sync: false
      - key: INTEGRATION_SAP_BASE_URL
        sync: false
      - key: INTEGRATION_SAP_CREDENTIAL_REF
        value: "env:INTEGRATION_SAP_TOKEN"
      - key: INTEGRATION_SAP_TOKEN
        sync: false
      - key: INTEGRATION_ERP_BASE_URL
        sync: false
      - key: INTEGRATION_ERP_CREDENTIAL_REF
        value: "env:INTEGRATION_ERP_TOKEN"
      - key: INTEGRATION_ERP_TOKEN
        sync: false

  - type: web
    name: avenick-customer
    runtime: node
    region: frankfurt
    plan: starter # free tier spins down on idle and may OOM during builds
    buildCommand: npm install -g pnpm@11.4.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@avenick/customer
    # Migrations run pre-deploy (inside the private network; builds can't reach the DB).
    preDeployCommand: bash -lc 'export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && pnpm --filter @avenick/database db:deploy'
    startCommand: pnpm --filter @avenick/customer exec next start -p $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: "https://avenick.vercel.app"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: "avenick-customer"
      - key: LOG_LEVEL
        value: "info"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: avenick-seller
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm@11.4.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@avenick/seller
    preDeployCommand: bash -lc 'export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && pnpm --filter @avenick/database db:deploy'
    startCommand: pnpm --filter @avenick/seller exec next start -p $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: "https://avenick-seller.vercel.app"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: "avenick-seller"
      - key: LOG_LEVEL
        value: "info"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: avenick-admin
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install -g pnpm@11.4.0 && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@avenick/admin
    preDeployCommand: bash -lc 'export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}" && pnpm --filter @avenick/database db:deploy'
    startCommand: pnpm --filter @avenick/admin exec next start -p $PORT
    healthCheckPath: /api/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: "https://avenick-admin.vercel.app"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: OTEL_SERVICE_NAME
        value: "avenick-admin"
      - key: LOG_LEVEL
        value: "info"
      - key: INTEGRATION_D365_BASE_URL
        sync: false
      - key: INTEGRATION_D365_CREDENTIAL_REF
        value: "env:INTEGRATION_D365_TOKEN"
      - key: INTEGRATION_SAP_BASE_URL
        sync: false
      - key: INTEGRATION_SAP_CREDENTIAL_REF
        value: "env:INTEGRATION_SAP_TOKEN"
      - key: INTEGRATION_ERP_BASE_URL
        sync: false
      - key: INTEGRATION_ERP_CREDENTIAL_REF
        value: "env:INTEGRATION_ERP_TOKEN"
      # Deployment-owned JSON array of per-connection signing identities:
      # [{"keyId":"...","system":"ERP","connectionId":"...","secret":"32+ chars"}]
      # Providers sign `<key-id>.<timestamp>.<raw body>` with HMAC-SHA256 hex.
      - key: INTEGRATION_WEBHOOK_SIGNING_KEYRING
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # Off-site logical backup: nightly pg_dump → S3-compatible object storage.
  # Independent of Neon's PITR (defense in depth). A non-zero exit is a failed
  # backup — alert on it. Restore/DR procedure: scripts/restore-database.sh + DR
  # runbook in ARCHITECTURE_RESILIENCE.md. Requires pg_dump on the image (Render
  # node runtime includes the postgres client).
  - type: cron
    name: avenick-db-backup
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 2 * * *" # 02:00 UTC daily
    buildCommand: npm install -g pnpm@11.4.0 && pnpm install --frozen-lockfile
    startCommand: bash scripts/backup-database.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "14"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
