packages:
  - "apps/*"
  - "packages/*"
  # apps/mobile is a Flutter app: no package.json, no node_modules, and pub
  # manages its own dependencies. Without this exclusion the "apps/*" glob
  # pulls it into the workspace, and pnpm and turbo both walk a directory
  # neither of them can do anything with. Its one generated file
  # (lib/theme/tokens.g.dart) is written by @avenick/design-tokens.
  - "!apps/mobile"

# Allow these trusted dependencies to run install/build scripts. pnpm v10+
# blocks dependency build scripts by default; without this the build fails
# (ERR_PNPM_IGNORED_BUILDS) and Prisma engines / esbuild binaries are skipped.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: false
  # Browser journey tooling (@avenick/e2e). Both download a browser binary from a
  # postinstall script; without an entry here pnpm skips the download silently and
  # the suites fail at launch rather than at install time.
  cypress: true
  puppeteer: true

minimumReleaseAgeExclude:
  - '@playwright/test@1.62.1'
  - playwright-core@1.62.1
  - playwright@1.62.1
