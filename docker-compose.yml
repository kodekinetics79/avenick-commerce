version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: manzil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manzil_db
      POSTGRES_USER: manzil
      POSTGRES_PASSWORD: manzil_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manzil -d manzil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: manzil_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: manzil_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: manzil_access
      MINIO_ROOT_PASSWORD: manzil_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket creation on startup
  minio-init:
    image: minio/mc:latest
    container_name: manzil_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set manzil http://minio:9000 manzil_access manzil_secret;
      mc mb --ignore-existing manzil/manzil-uploads;
      mc anonymous set download manzil/manzil-uploads;
      echo 'MinIO bucket ready';
      "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    container_name: manzil_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=manzil_elastic
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:manzil_elastic http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.16.1
    container_name: manzil_kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "elastic"
      ELASTICSEARCH_PASSWORD: "manzil_elastic"
    ports:
      - "5601:5601"
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_data:
  minio_data:
  elasticsearch_data:
